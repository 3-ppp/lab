<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>El Tirri y el Papa: Misión Don Orione</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #touch { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between; align-items:flex-end; padding:14px; pointer-events:none; }
  .grp { display:flex; gap:10px; align-items:flex-end; }
  .tb { pointer-events:auto; width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.5);
        color:#fff; font:8px monospace; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; }
  .tb.big { width:72px; height:72px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="grp"><div class="tb" data-k="L">◀</div><div class="tb" data-k="U">▲</div><div class="tb" data-k="R">▶</div></div>
  <div class="grp"><div class="tb" data-k="B">BOMBA</div><div class="tb" data-k="J">SALTO</div><div class="tb big" data-k="F">FUEGO</div></div>
</div>
<script>
// ===================== Configuración =====================
const W = 320, H = 180, G = 160;
const LEVEL = 3520, BOSSX = 3200;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px'; }
addEventListener('resize', fit); fit();
const FONT = "'Press Start 2P', monospace";

// ===================== Sprites =====================
const PAL = { h:'#3a2414', s:'#e8b48a', e:'#111', n:'#c98d63', w:'#f4f4f4', r:'#c0262d', k:'#23262f', K:'#15171d', b:'#0b0b0b',
  g:'#d6d6d6', j:'#3b5998', R:'#8b1d1d', p:'#333a44', d:'#7a4a22', D:'#4f2f14', y:'#ffd23f', q:'#14213d' };
function mk(rows){
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  rows.forEach((r, yy) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue;
    x.fillStyle = ch === 'T' ? (i % 2 ? '#1b2a6b' : '#f4f4f4') : ch === 'U' ? (i % 2 ? '#1f5fbf' : '#f4f4f4') : PAL[ch]; x.fillRect(i, yy, 1, 1); } });
  return c;
}
const LEGS = {
  a: ['...kkk.kkk..','...kkk.kkk..','...kkk.kkk..','...kk...kk..','...kk...kk..','..bbb...bbb.'],
  b: ['...kkkkkk...','....kkkk....','...kk..kk...','..kk....kk..','.kk......kk.','bbb......bbb'],
  j: ['...kkkkkkk..','...kkkkkkk..','....kk.kk...','....bb.bb...','............','............']
};
const legs = (t, c) => LEGS[t].map(r => r.replace(/k/g, c));
const set = (top, c) => ({ a: mk(top.concat(legs('a', c))), b: mk(top.concat(legs('b', c))), j: mk(top.concat(legs('j', c))) });

const TIRRI = set([
  '....hhhhh...','...hhhhhhh..','...hhhhhhh..','...hssssss..','...ssssesn..','...sssssss..','....ssssn...','.....sss....',
  '...kkwwwkk..','..kkkwrwkkk.','..kkkwrwkkk.','..kkkkrkkkk.','..kkkkrkkkk.','..kkkkkkkkk.','..kkkkkkkkk.','...KKKKKKK..'
], 'k');
const PAPA = set([
  '............','....gggg....','...gggggg...','...gssssg...','...ssssesn..','...sssssss..','....sssss...','.....sss....',
  '..TTTTTTTT..','.TTTTTTTTTT.','.TTTTTTTTTT.','.sTTTTTTTTs.','..TTTTTTTT..','..TTTTTTTT..','..jjjjjjjj..','..jjjjjjjj..'
], 'j');
const THUG = set([
  '....RRRR....','...RRRRRR...','...Rsssss...','...Rsssesn..','...Rsssss...','....ssss....','....ssss....','...RRRRRR...',
  '..RRRRRRRR..','..RRRRRRRR..','..RRRRRRRR..','..RRRRRRRR..','..RRRRRRRR..','..RRRRRRRR..','..pppppppp..','..pppppppp..'
], 'p');
// Gigante con camiseta a bastones azules y blancos, short azul
const GIANT = set([
  '....hhhh....','...hhhhhh...','...hssssh...','...ssssesn..','...sssssss..','...ssbbbs...','....ssss....','....ssss....',
  '..UUUUUUUU..','.UUUUUUUUUU.','.UUUUUUUUUU.','sUUUUUUUUUUs','s.UUUUUUUU.s','..UUUUUUUU..','..qqqqqqqq..','..qqqqqqqq..'
], 's');
const DOG_TOP = ['............dd..','...........dddd.','..........dddedD','d.........dddddd','.dddddddddddd...','..dddddddddddd..','..dddddddddd....'];
const DOG = [ mk(DOG_TOP.concat(['..d.d.....d.d...','..d.d.....d.d...','.dd.dd...dd.dd..'])),
              mk(DOG_TOP.concat(['...dd.....dd....','...d.d....d.d...','..d...d..d...d..'])) ];
const SKULL = mk(['...wwwwww...','..wwwwwwww..','.wwwwwwwwww.','.wwwwwwwwww.','.wbbwwwwbbw.','.wbbwwwwbbw.','.wwwwbbwwww.','..wwwbbwww..','..wwwwwwww..','..wbwbwbww..','...wwwwww...']);

function spr(img, x, y, flip, sc = 1){
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + img.width*sc, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, img.width*sc, img.height*sc); ctx.restore(); }
  else ctx.drawImage(img, x, y, img.width*sc, img.height*sc);
}
function disc(cx, cy, r, col){ ctx.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r*r - dy*dy)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), 2*w + 1, 1); } }
function txt(s, x, y, col = '#fff', align = 'left', size = 8){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, Math.round(x)+1, Math.round(y)+1); ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}

// ===================== Sonido =====================
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function beep(f, d = .08, type = 'square', v = .05, f2){
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
function noise(d = .3, v = .12){
  if (!AC) return; const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random()*2 - 1) * (1 - i/n);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = v; s.connect(g).connect(AC.destination); s.start();
}
const sfx = {
  shot: () => beep(900, .05, 'square', .04, 300), hmg: () => beep(500, .04, 'square', .035, 200), jump: () => beep(250, .12, 'square', .04, 600),
  hit: () => beep(150, .06, 'sawtooth', .05), boom: () => { noise(.35, .15); beep(120, .3, 'triangle', .1, 40); },
  pick: () => { beep(660, .08); setTimeout(() => beep(880, .08), 80); setTimeout(() => beep(1320, .12), 160); },
  ouch: () => beep(300, .15, 'square', .06, 100), die: () => beep(400, .5, 'square', .06, 60)
};

// ===================== Entrada =====================
const K = {}, P = {};
const MAP = { ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R', ArrowUp:'U', KeyW:'U', Space:'J', KeyZ:'J', KeyK:'J', KeyX:'F', KeyJ:'F', KeyC:'B', KeyL:'B', Enter:'S' };
addEventListener('keydown', e => { const k = MAP[e.code]; if (!k) return; e.preventDefault(); if (!K[k]) P[k] = true; K[k] = true; audio(); });
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) K[k] = false; });
cv.addEventListener('pointerdown', () => { audio(); P.S = true; });
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.getElementById('touch').style.display = 'flex';
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); if (!K[k]) P[k] = true; K[k] = true; P.S = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => K[k] = false));
});

// ===================== Nivel (se carga desde datos.json) =====================
// Cada registro de datos.json tiene un "tipo":
//   plataforma -> cajas, auto, bondi donde se puede subir (x, alto, ancho, valor = clase)
//   oleada     -> grupo de enemigos que aparece en x (valor: T = matón, D = perro)
//   objeto     -> cosa para recoger en x (valor: pucho, H, G, chori, moto)
let PLAT = [], TRIG0 = [], PICK0 = [], dataError = '';
function cargarNivel(registros){
  PLAT = registros.filter(r => r.tipo === 'plataforma').map(r => ({ x:r.x, y:G - r.alto, w:r.ancho, kind:r.valor }));
  TRIG0 = registros.filter(r => r.tipo === 'oleada').map(r => [r.x, r.valor]);
  PICK0 = registros.filter(r => r.tipo === 'objeto').map(r => [r.valor, r.x]);
}
const BOSSNAME = { 1:'COMBI MALDITA', 2:'EL GIGANTE DEL TOMBA', 3:'LOVE & HATE' };
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const isBoss = e => e.t === 'B' || e.t === 'G' || e.t === 'M';

// ===================== Estado =====================
// El récord se guarda solo en memoria (el proyecto corre aislado, sin localStorage).
let state = 'title', frame = 0, camX = 0, shake = 0, msgT = 0, msgS = '', score = 0, lives = 3, endT = 0, hiscore = 0;
let p, pp, enemies, bullets, ebullets, grenades, parts, picks, trig, bossMode, stage, nextT, obj;

function start(){
  if (dataError || !PICK0.length) return;
  state = 'play'; frame = 0; camX = 0; score = 0; lives = 3; bossMode = false; stage = 0; nextT = 0; endT = 0;
  p = { x:40, y:G-22, vx:0, vy:0, face:1, onGround:true, anim:0, cool:0, inv:120, moto:false, gun:'P', ammo:0, gren:10, dead:0, hp:5, max:5, up:false };
  pp = { x:18, y:G-22, vx:0, vy:0, face:1, onGround:true, anim:0, cool:40 };
  enemies = []; bullets = []; ebullets = []; grenades = []; parts = [];
  picks = PICK0.map(([t, x]) => ({ t, x, y:G-14, on:true }));
  trig = TRIG0.map(([x, s]) => ({ x, s, done:false }));
  obj = { moto:false, skull:false, jefes:0 };
  say('¡VAMOS A DON ORIONE!', 120);
}
function say(s, t = 100){ msgS = s; msgT = t; }

// ===================== Física y utilidades =====================
function phys(e, plats){
  e.vy = Math.min(e.vy + 0.2, 5); const prevB = e.y + 22; e.y += e.vy; e.onGround = false;
  if (plats && e.vy >= 0) for (const pl of PLAT) { const b = e.y + 22;
    if (prevB <= pl.y + 0.01 && b >= pl.y && e.x + 10 > pl.x && e.x + 2 < pl.x + pl.w) { e.y = pl.y - 22; e.vy = 0; e.onGround = true; } }
  if (e.y + 22 >= G) { e.y = G - 22; e.vy = 0; e.onGround = true; }
}
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pbox = () => p.moto ? { x:p.x - 6, y:p.y + 2, w:26, h:20 } : { x:p.x + 2, y:p.y + 2, w:9, h:20 };
function ebox(e){
  if (e.t === 'T') return { x:e.x + 2, y:e.y, w:9, h:22 };
  if (e.t === 'D') return { x:e.x + 1, y:e.y + 1, w:14, h:9 };
  if (e.t === 'G') return { x:e.x + 6, y:e.y + 4, w:24, h:62 };
  if (e.t === 'M') return { x:e.x, y:e.y, w:40, h:30 };
  return { x:e.x + 4, y:e.y + 4, w:68, h:36 };
}
function boom(x, y, n = 18, big = 1){
  for (let i = 0; i < n; i++) { const a = Math.random()*6.28, s = Math.random()*2*big + .3;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - .6, life:20 + Math.random()*20, c:['#fff3a0','#ffb02e','#ff5a1f','#6b6b6b'][i % 4], sz: 1 + (Math.random()*2*big|0) }); }
  shake = Math.max(shake, 4*big); sfx.boom();
}
function bits(x, y, cols, n = 10){ for (let i = 0; i < n; i++) parts.push({ x, y, vx:(Math.random()-.5)*3, vy:-Math.random()*3, life:30, c:cols[i % cols.length], sz:2, g:true }); }

function spawn(t, x){
  if (t === 'T') enemies.push({ t:'T', x, y:G-22, vx:0, vy:0, hp:2, face:-1, anim:0, onGround:true, cool:60 + Math.random()*80 });
  if (t === 'D') enemies.push({ t:'D', x, y:G-10, vx:-1.9, hp:1, face:-1, anim:0 });
}
function spawnBoss(s){
  if (s === 1) enemies.push({ t:'B', x:BOSSX + W + 10, y:G - 40, hp:80, max:80, dir:-1, cool:90, sp:240, enter:true, dead:0, flash:0 });
  if (s === 2) enemies.push({ t:'G', x:BOSSX + W + 10, y:G - 66, vx:0, vy:0, hp:110, max:110, face:-1, enter:true, onGround:true, t2:0, anim:0, dead:0, flash:0 });
  if (s === 3) [['HATE', -1, 40], ['LOVE', 1, 150]].forEach(([word, side, tm]) =>
    enemies.push({ t:'M', word, side, x:side < 0 ? BOSSX + 40 : BOSSX + 240, y:-60, vx:0, vy:0, hp:60, max:60, st:'return', tm, dead:0, flash:0 }));
}

function hitPlayer(d = 1){
  if (p.inv > 0 || p.dead) return;
  if (p.moto) { p.moto = false; p.inv = 90; boom(p.x + 6, p.y + 16, 24, 1.2); say('¡CHAU MOTO!', 80); return; }
  p.hp -= d; p.inv = 70; sfx.ouch(); bits(p.x + 6, p.y + 8, ['#c0262d','#23262f'], 6);
  if (p.hp <= 0) { p.hp = 0; p.dead = 70; boom(p.x + 6, p.y + 10, 20); sfx.die(); bits(p.x + 6, p.y + 8, ['#23262f','#c0262d','#e8b48a']); }
  else if (p.hp <= 2) say('¡NECESITO UN PUCHO!', 70);
}

// ===================== Actualización =====================
function update(){
  frame++;
  if (state === 'title') { if (P.S || P.F || P.J) start(); return; }
  if (state === 'over' || state === 'win') { endT++; if (endT > 60 && (P.S || P.F || P.J)) state = 'title'; return; }

  // --- el Tirri ---
  if (p.dead) {
    p.dead--;
    if (p.dead === 0) { lives--; if (lives < 0) { state = 'over'; endT = 0; saveHi(); return; }
      p.inv = 150; p.gun = 'P'; p.ammo = 0; p.hp = p.max; p.gren = Math.max(p.gren, 5); p.y = G - 60; p.vy = 0; say('¡DE NUEVO!', 60); }
  } else {
    const spd = p.moto ? 2.2 : 1.3;
    p.vx = K.L ? -spd : K.R ? spd : 0; if (p.vx) p.face = Math.sign(p.vx);
    p.up = !!K.U;
    if (P.J && p.onGround) { p.vy = p.moto ? -3.6 : -3.9; sfx.jump(); }
    p.x += p.vx; p.x = Math.max(camX + 2, Math.min(p.x, camX + W - 16));
    phys(p, true); p.anim++;
    if (p.cool > 0) p.cool--;
    if (K.F && p.cool <= 0) {
      let bx, by, vx, vy;
      if (p.up) { bx = p.x + (p.face > 0 ? 8 : 2); by = p.y - 6; vx = 0; vy = -5; }
      else { bx = p.face > 0 ? p.x + 17 : p.x - 5; by = p.y + (p.moto ? 7 : 8); vx = (p.gun === 'H' ? 5 : 4)*p.face; vy = 0; }
      if (p.gun === 'H') { const sp = (Math.random() - .5)*.5; bullets.push({ x:bx, y:by, vx:vx + (p.up ? sp : 0), vy:vy + (p.up ? 0 : sp), dmg:1, hmg:true }); p.cool = 5; sfx.hmg();
        if (--p.ammo <= 0) { p.gun = 'P'; say('SIN BALAS', 50); } }
      else { bullets.push({ x:bx, y:by, vx, vy, dmg:1 }); p.cool = 14; sfx.shot(); }
    }
    if (P.B && p.gren > 0) { p.gren--; grenades.push({ x:p.x + 6, y:p.y + 6, vx:1.8*p.face + p.vx*.5, vy:-2.6 }); beep(300, .05); }
    if (p.inv > 0) p.inv--;
  }

  // --- el Papa ---
  if (p.moto) { pp.x = p.x - 9*p.face; pp.y = p.y - 2; pp.face = p.face; pp.vx = 0; }
  else {
    const tx = p.x - 18*p.face, dx = tx - pp.x;
    pp.vx = Math.abs(dx) > 4 ? Math.sign(dx)*Math.min(1.6, Math.abs(dx)*.1) : 0;
    if (Math.abs(p.x - pp.x) > 140 || pp.x < camX - 20) { pp.x = Math.max(camX + 4, p.x - 18*p.face); pp.y = p.y - 20; }
    if (pp.onGround && p.y < pp.y - 10 && Math.abs(dx) < 40) pp.vy = -3.9;
    pp.x += pp.vx; phys(pp, true); pp.anim++;
  }
  let tgt = null, best = 200;
  for (const e of enemies) { if (e.dead) continue; const b = ebox(e), d = Math.abs(b.x + b.w/2 - pp.x); if (d < best && b.x + b.w > camX && b.x < camX + W) { best = d; tgt = e; } }
  if (tgt) { const b = ebox(tgt); pp.face = Math.sign(b.x + b.w/2 - pp.x) || 1; } else if (!p.moto && pp.vx) pp.face = Math.sign(pp.vx);
  if (--pp.cool <= 0 && tgt && !p.dead) {
    const b = ebox(tgt), tx = b.x + b.w/2, ty = b.y + b.h/2, ox = pp.x + (pp.face > 0 ? 16 : -4), oy = pp.y + 8, a = Math.atan2(ty - oy, tx - ox);
    bullets.push({ x:ox, y:oy, vx:Math.cos(a)*3.5, vy:Math.sin(a)*3.5, dmg:1, papa:true });
    pp.cool = 36; beep(700, .04, 'square', .025, 300);
  }

  // --- cámara, oleadas y jefes ---
  if (!bossMode) camX = Math.max(camX, Math.min(p.x - 120, BOSSX));
  for (const t of trig) if (!t.done && camX + W + 10 > t.x) { t.done = true; [...t.s].forEach((c, i) => spawn(c, Math.max(t.x, camX + W + 8) + i*26)); }
  if (!bossMode && p.x > BOSSX + 60) { bossMode = true; camX = BOSSX; stage = 1; spawnBoss(1); say('¡LA COMBI MALDITA!', 120); }
  if (nextT > 0 && --nextT === 0) spawnBoss(stage);
  if (stage >= 2 && frame % 480 === 0) picks.push({ t:'pucho', x:BOSSX + 30 + Math.random()*250, y:-10, on:true, fall:true });

  // --- enemigos ---
  const hands = enemies.filter(e => e.t === 'M' && !e.dead);
  for (const e of enemies) {
    if (e.flash > 0) e.flash--;
    if (e.dead) { e.dead++; const b = ebox(e);
      if (e.dead % 8 === 0 && e.dead < 60) boom(b.x + Math.random()*b.w, b.y + Math.random()*b.h, 14);
      if (e.t === 'G') { e.y += .5; }
      if (e.dead === 60) { e.remove = true; bossDown(e); } continue; }
    if (e.t === 'T') {
      const dir = Math.sign(p.x - e.x) || -1, d = Math.abs(p.x - e.x); e.face = dir;
      e.vx = d > 70 ? .6*dir : 0; e.x += e.vx; e.anim++; phys(e, false);
      if (--e.cool <= 0 && d < 220 && !p.dead) { ebullets.push({ x:e.x + (dir > 0 ? 14 : -2), y:e.y + 9, vx:1.6*dir, vy:0 }); e.cool = 90 + Math.random()*80; beep(220, .05, 'square', .02); }
    } else if (e.t === 'D') {
      e.x += e.vx; e.anim++; e.face = Math.sign(e.vx);
      if (e.vx < 0 && e.x < p.x - 70) e.vx = 1.9; if (e.vx > 0 && e.x > p.x + 70) e.vx = -1.9;
      if (ov(ebox(e), pbox())) hitPlayer(1);
    } else if (e.t === 'B') {
      if (e.enter) { e.x -= 1; if (e.x <= BOSSX + W - 90) e.enter = false; }
      else { e.x += e.dir*.6; if (e.x < BOSSX + 110) e.dir = 1; if (e.x > BOSSX + W - 80) e.dir = -1; }
      if (--e.cool <= 0 && !p.dead) {
        const ox = e.x + 4, oy = e.y + 12, a = Math.atan2(p.y + 10 - oy, p.x - ox);
        [-.2, 0, .2].forEach(s => ebullets.push({ x:ox, y:oy, vx:Math.cos(a + s)*1.8, vy:Math.sin(a + s)*1.8 }));
        e.cool = e.hp < 30 ? 55 : 85; beep(160, .1, 'sawtooth', .04);
      }
      if (--e.sp <= 0) { spawn('T', e.x + 30); e.sp = 300; }
      if (ov(ebox(e), pbox())) hitPlayer(2);

function updHand(e, hands){
  const hx = e.side < 0 ? BOSSX + 50 : BOSSX + 230, hy = 62;
  const otherBusy = hands.some(h => h !== e && h.st !== 'hover');
  const rate = hands.length > 1 ? 100 : 55;

      e.x += (hx + Math.sin(frame*.03 + e.side)*20 - e.x)*.05; e.y += (hy + Math.sin(frame*.05 + e.side)*6 - e.y)*.08;
      if (e.tm <= 0 && !otherBusy) { e.st = Math.random() < .6 ? 'aim' : 'swipeA'; e.tm = 55; }
      break;
    case 'aim':
      e.x += (p.x - 14 - e.x)*.08; e.y += (50 - e.y)*.1;

    case 'down': if (e.tm <= 0) e.st = 'up'; break;

    case 'swipeA': {

      if (e.tm <= 0) { e.st = 'swipe'; e.vx = -e.side*3; }

    case 'swipe': e.x += e.vx; if (e.x < BOSSX - 50 || e.x > BOSSX + W + 10) e.st = 'return'; break;
    case 'return':

      if (Math.abs(e.x - hx) < 3 && Math.abs(e.y - hy) < 3) { e.st = 'hover'; if (e.tm < rate) e.tm = rate; }
      break;
  }

}

  for (const b of bullets) { ctx.fillStyle = b.papa ? '#9fd8ff' : '#fff27a'; if (b.vx === 0 || Math.abs(b.vy) > Math.abs(b.vx)) ctx.fillRect(X(b.x), b.y, 1, 3); else ctx.fillRect(X(b.x), b.y, b.hmg ? 4 : 3, 1); }
  for (const b of ebullets) {
    if (b.k === 'ball') { disc(X(b.x) + 3, b.y + 3, 3, '#f4f4f4'); ctx.fillStyle = '#111'; ctx.fillRect(X(b.x) + 2, b.y + 2, 2, 2); continue; }
    if (b.k === 'wave') { ctx.fillStyle = '#c9a46a'; for (let i = 0; i < 4; i++) ctx.fillRect(X(b.x) + i*3, b.y + 7 - ((i + (frame >> 2)) % 3)*2 - 2, 2, 2 + ((i + (frame >> 2)) % 3)*2); continue; }
    ctx.fillStyle = '#ff7a2e'; ctx.fillRect(X(b.x), b.y, 3, 3); ctx.fillStyle = '#fff'; ctx.fillRect(X(b.x) + 1, b.y + 1, 1, 1);
  }
  for (const g of grenades) { ctx.fillStyle = '#2f5a2a'; ctx.fillRect(X(g.x), g.y, 3, 3); }
  for (const q of parts) { ctx.fillStyle = q.c; ctx.fillRect(X(q.x), q.y, q.sz, q.sz); }
  ctx.restore();
  drawHUD();
  if (state === 'over') { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); txt('GAME OVER', W/2, 70, '#ff5a3a', 'center', 16);
    txt('PUNTAJE ' + score, W/2, 98, '#fff', 'center'); if (endT > 60 && frame % 40 < 28) txt('ENTER / TOCÁ PARA VOLVER', W/2, 120, '#ffd23f', 'center', 6); }
  if (state === 'win') drawWin();
}
function drawHUD(){
  if (state === 'win') return;
  txt('1UP ' + String(score).padStart(6, '0'), 6, 5, '#ffd23f');
  for (let i = 0; i < Math.max(0, lives); i++) { const x = 6 + i*9, y = 16; ctx.fillStyle = '#e33'; ctx.fillRect(x, y + 1, 7, 3); ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + 4, y, 2, 1); ctx.fillRect(x + 1, y + 4, 5, 1); ctx.fillRect(x + 2, y + 5, 3, 1); ctx.fillRect(x + 3, y + 6, 1, 1); }
  txt('ENERGÍA', 6, 26, '#fff', 'left', 5);
  for (let i = 0; i < p.max; i++) { ctx.fillStyle = '#000'; ctx.fillRect(44 + i*7, 25, 6, 6);
    if (i < p.hp) { ctx.fillStyle = p.hp <= 2 ? (frame % 20 < 10 ? '#ff3b3b' : '#a01010') : '#5fe35f'; ctx.fillRect(45 + i*7, 26, 4, 4); } }
  txt(p.gun === 'H' ? 'ARMA H ' + p.ammo : 'ARMA PISTOLA', 6, H - 12, '#fff', 'left', 6);
  txt('BOMBAS ' + p.gren, 100, H - 12, '#fff', 'left', 6);
  txt((obj.moto ? '■' : '□') + ' MOTO', W - 6, 5, obj.moto ? '#7dff7a' : '#fff', 'right', 6);
  txt('JEFES ' + obj.jefes + '/3', W - 6, 14, obj.jefes === 3 ? '#7dff7a' : '#fff', 'right', 6);
  txt((obj.skull ? '■' : '□') + ' CALAVERA', W - 6, 23, obj.skull ? '#7dff7a' : '#fff', 'right', 6);
  const bs = enemies.filter(e => isBoss(e));
  if (bs.length) { const hp = bs.reduce((a, e) => a + Math.max(0, e.hp), 0), mx = bs.reduce((a, e) => a + e.max, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(W/2 - 61, 36, 122, 6); ctx.fillStyle = '#c0262d'; ctx.fillRect(W/2 - 60, 37, 120*hp/mx, 4);
    txt(BOSSNAME[stage], W/2, 44, '#fff', 'center', 6); }
  if (msgT > 0 && (msgT > 20 || frame % 6 < 3)) txt(msgS, W/2, 58, '#fff', 'center', 8);
  if (!bossMode && msgT <= 0 && frame % 60 < 40 && enemies.filter(e => e.x < camX + W).length === 0) txt('ADELANTE ▶', W - 60, 80, '#ffd23f', 'left', 6);
}
function drawTitle(){
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
  txt('EL TIRRI', W/2, 10, '#ffd23f', 'center', 16); txt('& EL PAPA', W/2, 30, '#ffd23f', 'center', 12);
  txt('MISIÓN: DON ORIONE', W/2, 47, '#9fd8ff', 'center', 8);
  spr(TIRRI.a, 128, 60, false, 2); spr(PAPA.a, 170, 60, true, 2);
  if (dataError) { txt(dataError, W/2, 110, '#ff8a7a', 'center', 6); }
  else if (!PICK0.length) { txt('CARGANDO NIVEL…', W/2, 110, '#fff', 'center', 6); }
  else if (frame % 50 < 34) txt('ENTER O TOCÁ PARA EMPEZAR', W/2, 110, '#ffd23f', 'center', 6);
  txt('Alguien se llevó la moto del Tirri', W/2, 123, '#fff', 'center', 6);
  txt('y la calavera de Murnau está en el barrio.', W/2, 132, '#fff', 'center', 6);
  txt('Los puchos le devuelven energía al Tirri.', W/2, 141, '#ffb02e', 'center', 6);
  txt('FLECHAS MOVER Y APUNTAR ARRIBA', W/2, 156, '#ccc', 'center', 6);
  txt('Z SALTA  X DISPARA  C BOMBA', W/2, 165, '#ccc', 'center', 6);
  if (hiscore) txt('RÉCORD ' + hiscore, W - 4, 4, '#fff', 'right', 5);
}
function drawWin(){
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
  txt('¡MISIÓN CUMPLIDA!', W/2, 22, '#7dff7a', 'center', 12);
  disc(W/2, 64, 18 + Math.sin(frame*.15)*2, 'rgba(160,255,190,.3)'); spr(SKULL, W/2 - 18, 48, false, 3);
  txt('Moto: ' + (obj.moto ? 'recuperada' : 'perdida'), W/2, 92, '#fff', 'center', 6);
  txt('Jefes vencidos: ' + obj.jefes + '/3', W/2, 102, '#fff', 'center', 6);
  txt('Calavera de Murnau: encontrada', W/2, 112, '#fff', 'center', 6);
  txt('PUNTAJE ' + score, W/2, 128, '#ffd23f', 'center', 8);
  if (endT > 60 && frame % 40 < 28) txt('ENTER / TOCÁ PARA VOLVER', W/2, 150, '#ffd23f', 'center', 6);
}

// ===================== Bucle =====================
let last = 0, acc = 0;
function loop(t){
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000/60) { update(); for (const k in P) delete P[k]; acc -= 1000/60; }
  draw(); requestAnimationFrame(loop);
}
// El bucle arranca enseguida; el nivel se carga desde datos.json (la "base de datos" del juego).
requestAnimationFrame(t => { last = t; loop(t); });
fetch('datos.json')
  .then(r => r.json())
  .then(cargarNivel)
  .catch(() => { dataError = 'NO PUDE CARGAR datos.json'; });
</script>
