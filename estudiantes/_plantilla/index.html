<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi proyecto</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { color: #1c3fc9; }
    input, button { font: inherit; padding: .5rem .7rem; }
    button { background: #1c3fc9; color: #fff; border: 0; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ccd; padding: .6rem 0; }
    li small { color: #667; display: block; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Mi colección</h1>
  <p>Los datos están en <code>datos.json</code>. Esta página los lee, los muestra y te deja buscar y agregar. Pedile a tu agente que lo convierta en tu proyecto.</p>

  <input id="buscar" type="search" placeholder="Buscar…" aria-label="Buscar">
  <ul id="lista"></ul>

  <form id="nuevo">
    <input id="titulo" placeholder="Nuevo elemento" required>
    <input id="detalle" placeholder="Detalle">
    <button>Agregar</button>
  </form>
  <p id="aviso" class="error"></p>

  <script>
    let datos = [];            // los datos viven en memoria mientras la página está abierta
    const lista = document.getElementById("lista");

    function mostrar() {
      const q = document.getElementById("buscar").value.toLowerCase();
      lista.replaceChildren();
      for (const d of datos) {
        if (!(d.titulo + " " + d.detalle).toLowerCase().includes(q)) continue;
        const li = document.createElement("li");
        li.textContent = d.titulo;
        const small = document.createElement("small");
        small.textContent = d.detalle;
        li.append(small);
        lista.append(li);
      }
    }

    // Leer los datos del archivo datos.json (la base de datos de este proyecto)
    fetch("datos.json")
      .then((r) => r.json())
      .then((json) => { datos = json; mostrar(); })
      .catch(() => { document.getElementById("aviso").textContent = "No pude cargar datos.json. Si abriste el archivo con doble clic, probá verlo desde el lab o con un servidor local."; });

    document.getElementById("buscar").oninput = mostrar;
    document.getElementById("nuevo").onsubmit = (e) => {
      e.preventDefault();
      // Agregar cambia los datos EN MEMORIA: al recargar vuelven a ser los del archivo.
      // Para guardarlos de verdad hay que editar datos.json (y subir el cambio).
      datos.push({ id: datos.length + 1, titulo: titulo.value, detalle: detalle.value });
      e.target.reset();
      mostrar();
    };
  </script>
</body>
</html>
