<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab del curso</title>
  <meta name="description" content="El mapa de proyectos del curso: cada punto es el proyecto de una persona, y late cuando cambia.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c3fc9'/%3E%3Crect x='11' y='11' width='10' height='10' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Lab del curso</h1>
      <p class="sub">Cada cuadrado es el proyecto de una persona. Late cuando cambia.</p>
    </div>
    <div class="row">
      <span id="vivo" class="vivo off" role="status">Conectando…</span>
      <a id="repo" class="btn ghost" href="#" hidden target="_blank" rel="noopener">Ver el repositorio</a>
    </div>
  </header>

  <main class="layout">
    <section class="mapa" aria-label="Mapa de proyectos">
      <svg id="svg" role="group" aria-label="Mapa: cada cuadrado es un proyecto" preserveAspectRatio="xMidYMid meet"></svg>
      <p id="vacio" class="vacio" hidden>Todavía no hay proyectos. El primero que aparezca va a ocupar el centro del mapa.</p>
      <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="lado">
      <div id="detalle" class="card detalle">
        <p class="muted">Tocá un cuadrado del mapa para ver ese proyecto.</p>
      </div>
      <div class="card">
        <h2>Actividad reciente</h2>
        <ul id="actividad" class="actividad"></ul>
      </div>
    </aside>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
